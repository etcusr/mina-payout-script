# Official Mina Foundation archive stack (адаптированный):
#   - postgres (с накатанным свежим mainnet-дампом)
#   - bootstrap_db (one-shot: качает дамп + накатывает + тюнит pg.conf)
#   - missing_blocks_guardian (фоном дотягивает пропуск между датой дампа и live tip
#                              из gs://mina-precomputed-blocks)
#   - mina_archive (слушает 3086, принимает блоки от mina_node)
#   - mina_node (non-producer daemon, синхронит цепь, шлёт блоки в archive)
#
# Producer (`mina` контейнер на default `bridge`) НЕ затрагивается.
# Эта инсталляция работает на отдельной docker-сети `mina-net`.
#
# Версии: 3.3.0-8c0c2e6-bullseye-mainnet для archive/daemon — соответствует
# тегу, которым публикуются эти SQL-дампы.
#
# Дамп прописан жёстко — Foundation публикует mainnet-дамп раз в месяц около
# 9-го числа. Чтобы переключиться на следующий — обнови переменную DUMP_DATE.

services:
  postgres:
    image: postgres:17
    container_name: mina-archive-pg
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: archive
    healthcheck:
      test: ["CMD-SHELL", "psql -U postgres -d archive -tAc \"SELECT 1\" | grep -q 1"]
      interval: 5s
      timeout: 10s
      retries: 30
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - mina-net
    shm_size: 2g

  bootstrap_db:
    image: minaprotocol/mina-archive:3.3.0-8c0c2e6-bullseye-mainnet
    container_name: mina-bootstrap-db
    environment:
      # Update это поле когда Foundation выложит более свежий дамп
      DUMP_DATE: "2026-05-09_0700"
      DUMP_URL_BASE: "https://storage.googleapis.com/mina-archive-dumps"
    command: >
      bash -c '
      set -e;
      cd /tmp;
      DUMP_FILE="mainnet-archive-dump-$$DUMP_DATE.sql.tar.gz";
      SQL_FILE="mainnet-archive-dump-$$DUMP_DATE.sql";
      if [ ! -f "$$SQL_FILE" ]; then
        echo "Скачиваю $$DUMP_FILE...";
        curl -fL -o "$$DUMP_FILE" "$$DUMP_URL_BASE/$$DUMP_FILE";
        echo "Распаковываю...";
        tar -zxvf "$$DUMP_FILE";
      fi;
      echo "Проверяю — БД уже накатана?";
      BLOCKS=$$(psql postgres://postgres:postgres@postgres:5432/archive -tAc "SELECT COUNT(*) FROM blocks" 2>/dev/null || echo 0);
      if [ "$$BLOCKS" -gt 1000 ]; then
        echo "БД уже содержит $$BLOCKS блоков, skip restore";
        exit 0;
      fi;
      echo "Тюню postgres для большого рестора...";
      PG=postgres://postgres:postgres@postgres:5432/archive;
      psql "$$PG" -c "ALTER SYSTEM SET max_connections = 500";
      psql "$$PG" -c "ALTER SYSTEM SET max_locks_per_transaction = 100";
      psql "$$PG" -c "ALTER SYSTEM SET max_pred_locks_per_relation = 100";
      psql "$$PG" -c "ALTER SYSTEM SET max_pred_locks_per_transaction = 5000";
      psql "$$PG" -c "SELECT pg_reload_conf()";
      echo "Накатываю SQL...";
      psql postgres://postgres:postgres@postgres:5432/archive -f "$$SQL_FILE";
      echo "Done. Размер БД:";
      psql postgres://postgres:postgres@postgres:5432/archive -c "SELECT pg_size_pretty(pg_database_size('"'"'archive'"'"'));";
      psql postgres://postgres:postgres@postgres:5432/archive -c "SELECT COUNT(*) AS blocks, MAX(height) AS tip FROM blocks;";
      '
    volumes:
      - ./bootstrap-tmp:/tmp
    networks:
      - mina-net
    depends_on:
      postgres:
        condition: service_healthy

  missing_blocks_guardian:
    image: minaprotocol/mina-archive:3.3.0-8c0c2e6-bullseye-mainnet
    container_name: mina-missing-blocks-guardian
    restart: unless-stopped
    # Своя реализация вместо foundation'овского скрипта с гитхаба:
    #  - fallback по нескольким источникам (GCS → S3 → ...)
    #    потому что Foundation любит сносить S3 ведра
    #  - blacklist навечно сломанных блоков, чтобы не зацикливаться
    #  - логика в ./scripts/blocks-guardian.sh
    environment:
      PG_CONN: postgres://postgres:postgres@postgres:5432/archive
      DAEMON_URL: http://mina_node:3085/graphql
      MINA_NETWORK: mainnet
    command: >
      bash -c '
      while true; do
        echo "=== guardian iteration $$(date -u +%H:%M:%S) ===";
        bash /scripts/blocks-guardian.sh || true;
        sleep 600;
      done
      '
    volumes:
      - ./scripts:/scripts:ro
      - ./guardian-tmp:/tmp
    networks:
      - mina-net
    depends_on:
      bootstrap_db:
        condition: service_completed_successfully

  mina_archive:
    image: minaprotocol/mina-archive:3.3.0-8c0c2e6-bullseye-mainnet
    container_name: mina-archive
    restart: unless-stopped
    command:
      - mina-archive
      - run
      - --postgres-uri
      - postgres://postgres:postgres@postgres:5432/archive
      - --server-port
      - "3086"
    networks:
      mina-net:
        aliases:
          - mina_archive
          - archive
    depends_on:
      bootstrap_db:
        condition: service_completed_successfully

  mina_node:
    image: minaprotocol/mina-daemon:3.3.0-8c0c2e6-bullseye-mainnet
    container_name: mina-follower
    restart: unless-stopped
    # Prover/verifier у Mina хорошо жрут shared memory. Дефолтный /dev/shm в
    # docker = 64MB — упирается. Поднимаем.
    shm_size: 4g
    # ulimit увеличиваем, т.к. mina открывает много файлов и сокетов
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Не оверрайдим entrypoint — используем стандартный /entrypoint.sh из образа.
    # Просто передаём аргументы как Cmd. Так делает официальный compose в их docs.
    # libp2p порт 8303 чтобы НЕ конфликтовать с твоим producer'ом на 8302.
    command:
      - daemon
      - --archive-address
      - mina_archive:3086
      - --peer-list-url
      - https://bootnodes.minaprotocol.com/networks/mainnet.txt
      - --insecure-rest-server
      - --rest-port
      - "3085"
      - --external-port
      - "8303"
      # NB: без --stop-time mina-daemon отключается через ~7 дней (костыль
      # mainnet'а для non-producer нод). restart: unless-stopped автоматически
      # поднимет контейнер обратно, persistent_frontier сохраняется в
      # ./follower-config/ → следующий старт = быстрый fast-forward, не bootstrap.
    ports:
      - "8303:8303"
    volumes:
      - ./follower-config:/root/.mina-config
    networks:
      - mina-net
    depends_on:
      bootstrap_db:
        condition: service_completed_successfully

networks:
  mina-net:
    name: mina-net
    driver: bridge
