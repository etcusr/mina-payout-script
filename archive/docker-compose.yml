# Mina archive stack, adapted from the Mina Foundation reference setup:
#   - postgres                 seeded from a recent mainnet dump
#   - bootstrap_db             one-shot: downloads the dump, restores it, tunes pg.conf
#   - missing_blocks_guardian  fills the gap between the dump date and the live tip
#   - mina_archive             listens on 3086, receives blocks from mina_node
#   - mina_node                non-producing daemon, syncs the chain, feeds the archive
#
# Your block producer is NOT touched: this stack runs on its own docker network
# `mina-net`, while a producer container normally sits on the default bridge.
#
# The dump date is pinned on purpose. The Foundation publishes a mainnet dump
# roughly monthly, around the 9th. To move to a newer one, update DUMP_DATE.

services:
  postgres:
    image: postgres:17
    container_name: mina-archive-pg
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: archive
    healthcheck:
      test: ["CMD-SHELL", "psql -U postgres -d archive -tAc \"SELECT 1\" | grep -q 1"]
      interval: 5s
      timeout: 10s
      retries: 30
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - mina-net
    shm_size: 2g

  bootstrap_db:
    image: minaprotocol/mina-archive:3.3.0-8c0c2e6-bullseye-mainnet
    container_name: mina-bootstrap-db
    environment:
      # Bump this when the Foundation publishes a newer dump
      DUMP_DATE: "2026-05-09_0700"
      DUMP_URL_BASE: "https://storage.googleapis.com/mina-archive-dumps"
    command: >
      bash -c '
      set -e;
      cd /tmp;
      DUMP_FILE="mainnet-archive-dump-$$DUMP_DATE.sql.tar.gz";
      SQL_FILE="mainnet-archive-dump-$$DUMP_DATE.sql";
      if [ ! -f "$$SQL_FILE" ]; then
        echo "Downloading $$DUMP_FILE...";
        curl -fL -o "$$DUMP_FILE" "$$DUMP_URL_BASE/$$DUMP_FILE";
        echo "Extracting...";
        tar -zxvf "$$DUMP_FILE";
      fi;
      echo "Is the database already populated?";
      BLOCKS=$$(psql postgres://postgres:postgres@postgres:5432/archive -tAc "SELECT COUNT(*) FROM blocks" 2>/dev/null || echo 0);
      if [ "$$BLOCKS" -gt 1000 ]; then
        echo "Database already holds $$BLOCKS blocks, skipping restore";
        exit 0;
      fi;
      echo "Tuning postgres for a large restore...";
      PG=postgres://postgres:postgres@postgres:5432/archive;
      psql "$$PG" -c "ALTER SYSTEM SET max_connections = 500";
      psql "$$PG" -c "ALTER SYSTEM SET max_locks_per_transaction = 100";
      psql "$$PG" -c "ALTER SYSTEM SET max_pred_locks_per_relation = 100";
      psql "$$PG" -c "ALTER SYSTEM SET max_pred_locks_per_transaction = 5000";
      psql "$$PG" -c "SELECT pg_reload_conf()";
      echo "Restoring SQL...";
      psql postgres://postgres:postgres@postgres:5432/archive -f "$$SQL_FILE";
      echo "Done. Database size:";
      psql postgres://postgres:postgres@postgres:5432/archive -c "SELECT pg_size_pretty(pg_database_size('"'"'archive'"'"'));";
      psql postgres://postgres:postgres@postgres:5432/archive -c "SELECT COUNT(*) AS blocks, MAX(height) AS tip FROM blocks;";
      '
    volumes:
      - ./bootstrap-tmp:/tmp
    networks:
      - mina-net
    depends_on:
      postgres:
        condition: service_healthy

  missing_blocks_guardian:
    image: minaprotocol/mina-archive:3.3.0-8c0c2e6-bullseye-mainnet
    container_name: mina-missing-blocks-guardian
    restart: unless-stopped
    # Custom implementation instead of the Foundation's script from GitHub:
    #  - falls back across several block sources (GCS, then S3, ...), because
    #    the Foundation has a habit of deleting buckets
    #  - blacklists permanently broken blocks instead of retrying them forever
    #  - see ./scripts/blocks-guardian.sh
    environment:
      PG_CONN: postgres://postgres:postgres@postgres:5432/archive
      DAEMON_URL: http://mina_node:3085/graphql
      MINA_NETWORK: mainnet
    command: >
      bash -c '
      while true; do
        echo "=== guardian iteration $$(date -u +%H:%M:%S) ===";
        bash /scripts/blocks-guardian.sh || true;
        sleep 600;
      done
      '
    volumes:
      - ./scripts:/scripts:ro
      - ./guardian-tmp:/tmp
    networks:
      - mina-net
    depends_on:
      bootstrap_db:
        condition: service_completed_successfully

  mina_archive:
    image: minaprotocol/mina-archive:3.3.0-8c0c2e6-bullseye-mainnet
    container_name: mina-archive
    restart: unless-stopped
    command:
      - mina-archive
      - run
      - --postgres-uri
      - postgres://postgres:postgres@postgres:5432/archive
      - --server-port
      - "3086"
    networks:
      mina-net:
        aliases:
          - mina_archive
          - archive
    depends_on:
      bootstrap_db:
        condition: service_completed_successfully

  mina_node:
    image: minaprotocol/mina-daemon:3.3.0-8c0c2e6-bullseye-mainnet
    container_name: mina-follower
    restart: unless-stopped
    # Mina's prover/verifier are hungry for shared memory. Docker's default
    # /dev/shm is 64MB, which is not enough - raise it.
    shm_size: 4g
    # mina opens a lot of files and sockets, so raise the fd limit too
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # The image's own /entrypoint.sh is kept; we only pass arguments as Cmd,
    # the same way the official compose file does.
    # libp2p uses 8303 here so it cannot clash with a producer on 8302.
    command:
      - daemon
      - --archive-address
      - mina_archive:3086
      - --peer-list-url
      - https://bootnodes.minaprotocol.com/networks/mainnet.txt
      - --insecure-rest-server
      - --rest-port
      - "3085"
      - --external-port
      - "8303"
      # NB: without --stop-time a mina daemon shuts itself down after ~7 days
      # (a mainnet quirk for non-producing nodes). `restart: unless-stopped`
      # brings it back, and persistent_frontier lives in ./follower-config/,
      # so the next start is a fast-forward rather than a full bootstrap.
    ports:
      - "8303:8303"
    volumes:
      - ./follower-config:/root/.mina-config
    networks:
      - mina-net
    depends_on:
      bootstrap_db:
        condition: service_completed_successfully

networks:
  mina-net:
    name: mina-net
    driver: bridge
